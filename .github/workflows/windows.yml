# Windows 앱을 실제 Windows에서 빌드합니다(맥에서는 컴파일 확인만 가능). 결과물은 Actions 실행 페이지의 Artifacts에서 받습니다.
name: Windows

on:
  push:
    branches: [master]
    paths:
      - 'WindowsApp/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test WindowsApp/Core.Tests -c Release
        if: matrix.rid == 'win-x64'
      # 게시할 때 yt-dlp·ffmpeg·ffprobe·deno를 받아 tools\에 넣습니다(App.csproj의 BundleTools).
      - run: dotnet publish WindowsApp/App/App.csproj -c Release -r ${{ matrix.rid }} -o out/YoutubePlaylistDownloader
      - uses: actions/upload-artifact@v4
        with:
          name: YoutubePlaylistDownloader-${{ matrix.rid }}
          path: out/
